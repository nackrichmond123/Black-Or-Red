<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Guessing</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="Responsiveness.css">
</head>
<body>
    <!-- <script>alert('Click the Black or Red Button to Play the Game')</script> -->
    <h1>Colour Guess</h1>
    <div class="container"><br>
        <input type="text" id="display" readonly value="🤍"><br><br>
  
        <button class="btn" id="red" title="Choose Red Heart" onclick="computerMove(); Red()">Red</button>
        OR
        <button class="btn" id="black" title="Choose Black Heart" onclick="computerMove(); Black()">Black</button>

        <h3 id="scoreBoard">ScoreBoard</h3>
        <div class="signs">
            <h1>❌</h1>
            <h1>✅</h1>
            <h1>🔢</h1>
        </div>
        <div class="Scores">
            <input type="text" class="showResults" readonly id="errors" placeholder="0" value="0">

            <input type="text" class="showResults" readonly id="corrects" placeholder="0" value="0">

            <input type="text" class="showResults" readonly id="attempts" placeholder="0" value="0">

        </div><br><br>


        <button id="reset" onclick="Reset()">Restart</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
