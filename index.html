<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Guessing</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Colour Guess</h1>
    <div class="container"><br>
        <input type="text" id="display" readonly value="🤍"><br><br>
  
        <button class="btn" id="red" title="Choose Red Heart" onclick="Red()">Red</button>
        OR
        <button class="btn" id="black" title="Choose Black Heart" onclick="Black()">Black</button>

        <h3 id="score">Score</h3>
        <input type="text" readonly id="scoreBoard" placeholder="0" ><br><br>
        <button id="reset" onclick="Reset()">Restart</button>
    </div>

    <p>Errors</p>
    <p id="error"></p>

    <p>Attempts</p>
    <p id="attempts"></p>    

    <script src="index.js"></script>
</body>
</html>
